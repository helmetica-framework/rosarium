name: Build and deploy docs.helmetica.io

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, closed]
  # New reagents show up without a change here: rediscover every hour.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  site:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Production and previews both push to gh-pages: one at a time.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: '1.51.0'

      - name: Build site
        run: just build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: build/_public
          git-config-name: "rosarium"
          git-config-email: "rosarium@helmetica.io"
          # Do not keep history on the gh-pages branch
          single-commit: true
          # PR previews live next to the site; a production deploy keeps them.
          clean-exclude: pr-preview/

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: github.event.action != 'closed'
        with:
          go-version-file: 'go.mod'

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        if: github.event.action != 'closed'
        with:
          # renovate: datasource=github-releases depName=casey/just
          just-version: '1.51.0'

      - name: Build preview
        if: github.event.action != 'closed'
        run: just build --site-url https://docs.helmetica.io/pr-preview/pr-${{ github.event.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deploys to gh-pages:pr-preview/pr-<N>/ and comments the link on the PR;
      # removes the folder again when the PR is closed. PRs from forks have no
      # write token and get no preview.
      - name: Deploy preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: build/_public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          custom-url: docs.helmetica.io
